# ==============================================================================
# Production Nginx Configuration with SSL / HTTPS (Let's Encrypt)
# ==============================================================================

# HTTP - Redirect all traffic to HTTPS
server {
    listen 80;
    server_name temar-lije.southafricanorth.cloudapp.azure.com 172.209.217.233 localhost;
    client_max_body_size 100M;

    # Allow Let's Encrypt HTTP-01 challenge renewals
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Redirect all HTTP requests to secure HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Full TLS / SSL Server
server {
    listen 443 ssl;
    server_name temar-lije.southafricanorth.cloudapp.azure.com 172.209.217.233 localhost;
    client_max_body_size 100M;

    # SSL Certificate Paths (Mounted from Let's Encrypt on Host)
    ssl_certificate /etc/letsencrypt/live/temar-lije.southafricanorth.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/temar-lije.southafricanorth.cloudapp.azure.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Frontend Static SPA Assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to NestJS Backend container
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy Uploads static media files
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Proxy WebSocket socket.io traffic
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
