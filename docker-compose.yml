version: "3.8"

services:
  # ============================================================================
  # Database Service (PostgreSQL 16)
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: temar_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-temar_lije}
    ports:
      - "5432:5432"
    volumes:
      # Persistent PostgreSQL data directory
      - pgdata:/var/lib/postgresql/data
      # Auto-seed database from SQL dump on initial container creation
      - ./Database/temar_lije.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-temar_lije}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - temar_network

  # ============================================================================
  # Backend Service (NestJS / Node.js)
  # ============================================================================
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: fanuelg/temar_backend:latest
    container_name: temar_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Connects to database service using the service name 'db' as the hostname
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-temar_lije}?schema=public
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-https://temar-lije.southafricanorth.cloudapp.azure.com}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-https://temar-lije.southafricanorth.cloudapp.azure.com/api/auth/google/callback}
      - GOOGLE_OAUTH_STATE_SECRET=${GOOGLE_OAUTH_STATE_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_SECURE=${SMTP_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/usr/src/app/uploads
    networks:
      - temar_network

  # ============================================================================
  # Frontend Service (React / Vite + Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./temar_lije
      dockerfile: Dockerfile
    container_name: temar_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - temar_network

# ==============================================================================
# Persistent Volumes & Custom Bridge Network
# ==============================================================================
volumes:
  pgdata:
    driver: local
  backend_uploads:
    driver: local

networks:
  temar_network:
    driver: bridge
